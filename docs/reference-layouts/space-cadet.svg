<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
<title id="title">3D Pinball Space Cadet schematic layout</title><desc id="desc">Original top-down schematic showing the Space Cadet table elements and ball routes.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#ffcf5a"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#67d8ff"/></marker></defs>
<rect width="720" height="1040" fill="#111827"/><text x="360" y="34" fill="#fff" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="bold">3D PINBALL: SPACE CADET · SCHEMATIC</text>
<path d="M100 70Q70 80 70 130V890L110 970H610L650 890V130Q650 80 620 70Z" fill="#202b3c" stroke="#a8b5c8" stroke-width="6"/>
<!-- launch lane --> <path d="M590 90V265Q575 300 540 300" fill="none" stroke="#9ca9ba" stroke-width="22"/><text x="606" y="190" fill="#e5e7eb" font-size="15" transform="rotate(90 606 190)" font-family="sans-serif">DEPLOYMENT / PLUNGER</text>
<!-- top bumper field --> <g fill="#526072" stroke="#e2e8f0" stroke-width="3"><circle cx="270" cy="170" r="38"/><circle cx="360" cy="155" r="38"/><circle cx="450" cy="170" r="38"/><circle cx="130" cy="190" r="28" fill="#5b7492"/></g><text x="355" y="220" fill="#dce8fa" text-anchor="middle" font-size="15" font-family="sans-serif">3 ATTACK BUMPERS</text><text x="130" y="235" fill="#dce8fa" text-anchor="middle" font-size="12" font-family="sans-serif">SATELLITE</text>
<!-- upper lane labels --> <g fill="#b8c5d8" font-size="13" font-family="sans-serif"><text x="185" y="95">MULTIPLIER TARGETS</text><text x="290" y="80">3 RE-ENTRY LANES</text><text x="475" y="95">RED WORMHOLE</text></g>
<!-- right hyperspace --> <path d="M520 320Q600 270 575 210" fill="none" stroke="#67d8ff" stroke-width="16"/><rect x="532" y="268" width="82" height="48" rx="12" fill="#164e63" stroke="#67d8ff" stroke-width="3"/><text x="573" y="288" fill="#e0f7ff" font-size="12" text-anchor="middle" font-family="sans-serif">HYPERSPACE</text><text x="573" y="303" fill="#e0f7ff" font-size="12" text-anchor="middle" font-family="sans-serif">KICKER</text>
<!-- left fuel and ramp --> <path d="M130 300Q95 380 145 480Q165 530 235 570" fill="none" stroke="#4f8b72" stroke-width="18"/><text x="105" y="397" fill="#d1fae5" font-size="15" transform="rotate(-72 105 397)" font-family="sans-serif">FUEL CHUTE</text><path d="M250 555Q330 470 420 400" fill="none" stroke="#a78bfa" stroke-width="22"/><text x="295" y="490" fill="#eee7ff" font-size="15" transform="rotate(-38 295 490)" font-family="sans-serif">LAUNCH RAMP</text>
<!-- launch platform --> <rect x="280" y="330" width="215" height="215" rx="24" fill="#43326e" stroke="#b9a4ff" stroke-width="4"/><text x="387" y="355" fill="#f2eaff" font-size="16" text-anchor="middle" font-family="sans-serif">LAUNCH PLATFORM</text><g fill="#c4b5fd" stroke="#e2e8f0" stroke-width="2"><rect x="316" y="374" width="24" height="42" rx="8"/><rect x="375" y="374" width="24" height="42" rx="8"/><rect x="434" y="374" width="24" height="42" rx="8"/></g><text x="387" y="435" fill="#f2eaff" font-size="11" text-anchor="middle" font-family="sans-serif">3 ENGINE LANES</text><g fill="#9ca9ba" stroke="#e2e8f0" stroke-width="2"><circle cx="340" cy="477" r="27"/><circle cx="387" cy="477" r="27"/><circle cx="434" cy="477" r="27"/></g><text x="387" y="525" fill="#f2eaff" font-size="12" text-anchor="middle" font-family="sans-serif">3 ENGINE BUMPERS</text>
<!-- center targets/wormholes --> <g fill="#d7b84b" stroke="#fff0a6" stroke-width="2"><rect x="270" y="610" width="34" height="42" rx="4"/><rect x="314" y="610" width="34" height="42" rx="4"/><rect x="358" y="610" width="34" height="42" rx="4"/></g><text x="330" y="674" fill="#f8e7a0" font-size="13" text-anchor="middle" font-family="sans-serif">MEDAL TARGETS</text><rect x="125" y="560" width="70" height="45" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="3"/><text x="160" y="588" fill="#dcfce7" font-size="12" text-anchor="middle" font-family="sans-serif">GREEN HOLE</text><g fill="#64748b" stroke="#cbd5e1" stroke-width="3"><circle cx="540" cy="575" r="23"/><circle cx="565" cy="700" r="23"/></g><text x="553" y="620" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">WORMHOLES</text>
<!-- lower center --> <circle cx="360" cy="780" r="65" fill="#263343" stroke="#fbbf24" stroke-width="4"/><circle cx="360" cy="780" r="30" fill="#111827" stroke="#93c5fd" stroke-width="3"/><text x="360" y="777" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="sans-serif">GRAVITY</text><text x="360" y="794" fill="#e5e7eb" font-size="13" text-anchor="middle" font-family="sans-serif">WELL</text>
<!-- lanes/flippers --> <path d="M150 790L150 900L275 910M570 790L570 900L445 910" fill="none" stroke="#a8b5c8" stroke-width="20"/><text x="110" y="850" fill="#dbeafe" font-size="12" font-family="sans-serif">RETURN / OUT</text><text x="575" y="850" fill="#dbeafe" font-size="12" font-family="sans-serif">RETURN / OUT</text><path d="M280 900L350 925M440 900L370 925" stroke="#ffd166" stroke-width="18" stroke-linecap="round"/><text x="360" y="958" fill="#fff" font-size="14" text-anchor="middle" font-family="sans-serif">FLIPPERS · CENTER DRAIN</text>
<!-- route overlays --> <path d="M590 265Q575 315 505 330Q520 380 500 430Q490 475 465 510" fill="none" stroke="#ffcf5a" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#a)"/><path d="M450 505Q315 575 205 595Q160 620 230 700Q280 755 340 880" fill="none" stroke="#ffcf5a" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#a)"/><path d="M340 880Q275 760 225 680Q180 600 145 480Q105 380 130 300Q200 250 270 210" fill="none" stroke="#67d8ff" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#b)"/>
<text x="360" y="1015" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="sans-serif">Routes are simplified; wormholes and kickers teleport or relaunch the ball.</text>
</svg>
